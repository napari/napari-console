# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py311-{linux,macos,windows}-pyqt6,py314-{linux,macos,windows}-{pyqt6,pyside6}
toxworkdir=/tmp/.tox
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows
QT_PACKAGE =
    pyqt6: pyqt6
    pyside6: pyside6

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
setenv =
    PYTHONPATH = {toxinidir}
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
deps =
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pyqt6: napari[pyqt6,testing]
    pyside6: napari[pyside6,testing]
    pyqt6: .[pyqt]
    pyside6: .[pyside]
    # legacy Qt5 coverage (not in envlist — run explicitly via
    # `tox -e py311-linux-pyqt5` from the test-pyqt5 CI job)
    pyqt5: napari[pyqt5,testing]
    pyqt5: .[pyqt5]
    imageio !=2.22.1  # workaround for https://github.com/imageio/imageio/issues/887
commands = pytest -v --color=yes --cov=napari_console --cov-report=xml
