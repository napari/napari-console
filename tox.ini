# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py310-{linux,macos,windows}-{pyqt,pyside},py314-{linux,macos,windows}-{pyqt,pyside}
toxworkdir=/tmp/.tox
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
setenv =
    PYTHONPATH = {toxinidir}
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
deps =
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pyqt: napari[pyqt6,testing]
    pyside: napari[pyside6,testing]
    pyqt: .[pyqt]
    pyside: .[pyside]
    # legacy Qt5 coverage (not in envlist — run explicitly via
    # `tox -e py310-linux-pyqt5` from the test-pyqt5 CI job)
    pyqt5: napari[pyqt5,testing]
    pyqt5: .[pyqt5]
    imageio !=2.22.1  # workaround for https://github.com/imageio/imageio/issues/887
commands = pytest -v --color=yes --cov=napari_console --cov-report=xml
